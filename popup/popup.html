<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactacam NS Toolkit</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <!-- ── Header ─────────────────────────────────────────────────── -->
    <header class="tacta-header">
        <div class="tacta-header-left">
            <div class="tacta-logo">
                <span class="tacta-logo-mark">T</span>
                <span class="tacta-logo-text">NS Toolkit</span>
            </div>
            <div class="tacta-env" id="envIndicator">
                <span class="tacta-env-dot" id="envDot"></span>
                <span class="tacta-env-label" id="envLabel">Detecting...</span>
            </div>
        </div>
        <div class="tacta-header-right">
            <select class="tacta-user-type-select" id="userTypeSelect" title="User type — controls which features are enabled by default">
                <option value="user">User</option>
                <option value="developer">Developer</option>
            </select>
            <button class="tacta-meeting-toggle" id="meetingToggle" title="Meeting Mode — hides all visual modifications">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M1 3.5h10v7H1z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" fill="none"/>
                    <path d="M11 5.5l4-2v7l-4-2" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" fill="none"/>
                </svg>
                <span class="tacta-meeting-label">Meeting</span>
            </button>
        </div>
    </header>

    <!-- ── Quick Actions ──────────────────────────────────────────── -->
    <section class="tacta-section">
        <h2 class="tacta-section-title">Quick Actions</h2>
        <div class="tacta-quick-actions" id="quickActions">
            <button class="tacta-action-btn" data-action="field-explorer" title="Field Explorer">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <circle cx="9" cy="9" r="5.5" stroke="currentColor" stroke-width="1.4"/>
                    <path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    <path d="M7 9h4M9 7v4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                </svg>
                <span>Fields</span>
            </button>
            <button class="tacta-action-btn" data-action="record-object" title="Record Object Viewer">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M4 3h12v14H4z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                    <path d="M7 7h6M7 10h4M7 13h5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                </svg>
                <span>Record</span>
            </button>
            <button class="tacta-action-btn" data-action="script-explorer" title="Script Explorer">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M6 4l-4 5 4 5M14 4l4 5-4 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 3L8 17" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                </svg>
                <span>Scripts</span>
            </button>
            <button class="tacta-action-btn" data-action="suiteql-runner" title="SuiteQL Runner">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M3 4h14v12H3z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                    <path d="M6 8l2 2-2 2M10 12h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>SuiteQL</span>
            </button>
        </div>
    </section>

    <!-- ── Active Features ────────────────────────────────────────── -->
    <section class="tacta-section" id="activeFeaturesSection">
        <h2 class="tacta-section-title">
            Active on This Page
            <span class="tacta-active-count" id="activeCount">0</span>
        </h2>
        <div class="tacta-active-features" id="activeFeatures">
            <p class="tacta-empty-state">No features active on this page</p>
        </div>
    </section>

    <!-- ── Feature Toggles ────────────────────────────────────────── -->
    <section class="tacta-section tacta-section-toggles">
        <h2 class="tacta-section-title">Features</h2>
        <div class="tacta-feature-groups" id="featureGroups"></div>
    </section>

    <!-- ── Footer ─────────────────────────────────────────────────── -->
    <footer class="tacta-footer">
        <span class="tacta-version">v1.0.0</span>
        <a href="#" class="tacta-options-link" id="optionsLink">Options</a>
        <span class="tacta-brand">Tactacam</span>
    </footer>

    <script src="../shared/theme-manager.js"></script>
    <script src="popup.js"></script>
</body>
</html>
